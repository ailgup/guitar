<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guitar Chords Finder</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        display: flex;
        justify-content: center;
        background: #c5c5c5;
        margin: 0;
        font-family: monospace;
      }

      main {
        max-width: 100%;
        padding: 20px;
        box-sizing: border-box;
        background: #fffaed;
        flex: 0 1 900px;
        width: 100%;
      }

      h1 {
        margin: 0;
        font-size: 20px;
      }

      .header-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }

      .title-link {
        color: inherit;
        text-decoration: none;
      }

      form {
        margin: 0;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }

      .controls.inline {
        margin-bottom: 0;
      }

      .controls input[type="text"] {
        padding: 6px 8px;
        font-family: monospace;
      }

      button {
        padding: 6px 10px;
        font-family: monospace;
        cursor: pointer;
      }

      .status {
        margin: 8px 0 12px;
        min-height: 18px;
      }

      table {
        border-collapse: collapse;
        width: 100%;
      }

      th,
      td {
        border-bottom: 1px solid #ddd;
        text-align: left;
        padding: 6px;
        vertical-align: top;
      }

      tr:nth-child(even) {
        background: #f6f2e4;
      }

      .sheet {
        font-family: monospace;
        white-space: normal;
        overflow: auto;
        line-height: 1.5;
        margin-top: 16px;
      }

      .artist {
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 2px;
      }

      .song {
        font-size: 14px;
        margin-bottom: 6px;
      }

      .chords {
        margin-top: 15px;
        font-size: 12px;
        white-space: pre;
      }

      .chords > div {
        display: contents;
      }

      .grid-container {
        display: grid;
        grid-template-columns: auto;
        gap: 10px;
      }

      .chord-shapes {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 4px;
        margin-bottom: 6px;
      }

      .pagination {
        margin: 10px 0;
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .note {
        font-size: 12px;
        color: #333;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="header-row">
        <h1><a class="title-link" href="./single.html">Guitar Chords Finder</a></h1>
        <form id="search-form">
          <div class="controls inline">
          <input
            id="search-input"
            type="text"
            placeholder="Artist or Song Name"
            autocomplete="off"
          />
          <button type="submit">Search</button>
          </div>
        </form>

        <div id="song-controls" class="controls inline" hidden>
        <div>
          Transpose
          <button type="button" id="transpose-down">-</button>
          <span id="transpose-value">0</span>
          <button type="button" id="transpose-up">+</button>
        </div>
        <div>
          Font
          <button type="button" id="font-down">-</button>
          <span id="font-value">12</span>
          <button type="button" id="font-up">+</button>
        </div>
        <label>
          Columns
          <select id="columns-input">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </label>
        </div>
      </div>

      <div id="status" class="status"></div>
      <div id="search-results"></div>

      <section class="sheet">
        <div id="artist" class="artist"></div>
        <div id="song" class="song"></div>
        <div id="chord-shapes" class="chord-shapes"></div>
        <div id="chords-grid" class="grid-container">
          <div id="chords-col-1" class="chords grid-item"></div>
          <div id="chords-col-2" class="chords grid-item"></div>
          <div id="chords-col-3" class="chords grid-item"></div>
        </div>
      </section>
    </main>

    <script>
      const FIXED_PROXY = 'https://api.codetabs.com/v1/proxy/?quest=';
      const EXCLUDED_TYPES = [
        'Power',
        'Video',
        '',
        'Official',
        'Pro',
        'Ukulele Chords',
        'Bass Tabs',
        'Drum Tabs'
      ];

      const searchForm = document.getElementById('search-form');
      const searchInput = document.getElementById('search-input');
      const songControlsEl = document.getElementById('song-controls');
      const transposeDownBtn = document.getElementById('transpose-down');
      const transposeUpBtn = document.getElementById('transpose-up');
      const transposeValueEl = document.getElementById('transpose-value');
      const fontDownBtn = document.getElementById('font-down');
      const fontUpBtn = document.getElementById('font-up');
      const fontValueEl = document.getElementById('font-value');
      const columnsInput = document.getElementById('columns-input');
      const statusEl = document.getElementById('status');
      const resultsEl = document.getElementById('search-results');
      const artistEl = document.getElementById('artist');
      const songEl = document.getElementById('song');
      const chordShapesEl = document.getElementById('chord-shapes');
      const chordsGridEl = document.getElementById('chords-grid');
      const chordsCol1El = document.getElementById('chords-col-1');
      const chordsCol2El = document.getElementById('chords-col-2');
      const chordsCol3El = document.getElementById('chords-col-3');
      const chordNames = [];
      let currentTranspose = 0;
      let currentFont = 12;
      let currentCols = 1;

      function getParams() {
        return new URLSearchParams(window.location.search);
      }

      function setStatus(message, isError) {
        statusEl.textContent = message;
        statusEl.style.color = isError ? '#b00020' : '#111';
      }

      function buildProxyUrl(target) {
        return FIXED_PROXY + encodeURIComponent(target);
      }

      const TONES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
      const FLAT_MAP = { Db: 'C#', Eb: 'D#', Gb: 'F#', Ab: 'G#', Bb: 'A#' };

      function normalizeTone(tone) {
        return FLAT_MAP[tone] || tone;
      }

      function transposeTone(tone, steps) {
        const normalized = normalizeTone(tone);
        const index = TONES.indexOf(normalized);
        if (index === -1) {
          return tone;
        }
        const next = (index + steps + TONES.length) % TONES.length;
        return TONES[next];
      }

      function transposeChord(chord, steps) {
        if (!steps) {
          return chord;
        }
        return chord.replace(/^([A-G])([b#]?)(.*)$/i, (_, root, accidental, rest) => {
          const tone = `${root.toUpperCase()}${accidental || ''}`;
          const transposed = transposeTone(tone, steps);
          const updatedRest = (rest || '').replace(/\/([A-G])([b#]?)/g, (match, bass, bassAcc) => {
            const bassTone = `${bass.toUpperCase()}${bassAcc || ''}`;
            return `/${transposeTone(bassTone, steps)}`;
          });
          return `${transposed}${updatedRest}`;
        });
      }

      function transformChords(raw, steps) {
        if (!raw) {
          return '';
        }
        return raw.replace(/\[ch\]([^\[]+?)\[\/ch\]/g, (match, chordText) => {
          const transposed = transposeChord(chordText.trim(), steps);
          return `[ch]${transposed}[/ch]`;
        });
      }

      function formatChords(raw, steps) {
        const transposed = transformChords(raw, steps);
        return transposed
          .replace(/\[ch\]/g, '<b>')
          .replace(/\[\/ch\]/g, '</b>')
          .replace(/\[tab\]/g, '<div>')
          .replace(/\[\/tab\]/g, '</div>');
      }

      function splitColumns(html, columns) {
        const text = html.replace(/\r/g, '');
        const lines = text.split('\n');
        if (columns <= 1) {
          return [text, '', ''];
        }
        if (columns === 2) {
          const mid = Math.ceil(lines.length / 2);
          return [lines.slice(0, mid).join('\n'), lines.slice(mid).join('\n'), ''];
        }
        const third = Math.ceil(lines.length / 3);
        return [
          lines.slice(0, third).join('\n'),
          lines.slice(third, third * 2).join('\n'),
          lines.slice(third * 2).join('\n')
        ];
      }

      function findInObject(obj, key) {
        let objects = [];
        const keys = Object.keys(obj || {});
        for (let i = 0; i < keys.length; i += 1) {
          const currentKey = keys[i];
          if (Object.prototype.hasOwnProperty.call(obj, currentKey)) {
            if (typeof obj[currentKey] === 'object') {
              objects = objects.concat(findInObject(obj[currentKey], key));
            } else if (currentKey === key) {
              objects.push(obj[currentKey]);
            }
          }
        }
        return objects;
      }

      function navigate(updates, replace) {
        const params = getParams();
        Object.entries(updates).forEach(([key, value]) => {
          if (value === null || value === undefined || value === '') {
            params.delete(key);
          } else {
            params.set(key, value);
          }
        });
        const query = params.toString();
        const nextUrl = query ? `${window.location.pathname}?${query}` : window.location.pathname;
        if (replace) {
          window.history.replaceState({}, '', nextUrl);
        } else {
          window.history.pushState({}, '', nextUrl);
        }
        runFromUrl();
      }

      function clearSong() {
        artistEl.textContent = '';
        songEl.textContent = '';
        chordShapesEl.innerHTML = '';
        chordsCol1El.innerHTML = '';
        chordsCol2El.innerHTML = '';
        chordsCol3El.innerHTML = '';
        chordsGridEl.dataset.rawChords = '';
        chordNames.length = 0;
      }

      function renderPagination(pagination, query) {
        const container = document.createElement('div');
        container.className = 'pagination';

        const info = document.createElement('span');
        info.textContent = `Page ${pagination.current} of ${pagination.total}`;
        container.appendChild(info);

        if (pagination.current > 1) {
          const prevButton = document.createElement('button');
          prevButton.type = 'button';
          prevButton.textContent = '◀';
          prevButton.addEventListener('click', () => {
            navigate({ q: query, page: String(pagination.current - 1), view: 'search' });
          });
          container.appendChild(prevButton);
        }

        if (pagination.current < pagination.total) {
          const nextButton = document.createElement('button');
          nextButton.type = 'button';
          nextButton.textContent = '▶';
          nextButton.addEventListener('click', () => {
            navigate({ q: query, page: String(pagination.current + 1), view: 'search' });
          });
          container.appendChild(nextButton);
        }

        return container;
      }

      async function loadSearch(query, page) {
        if (!query) {
          resultsEl.innerHTML = '';
          return;
        }

        setStatus('Searching...', false);
        resultsEl.innerHTML = '';

        const searchUrl = `https://www.ultimate-guitar.com/search.php?search_type=title&page=${page}&value=${encodeURIComponent(
          query
        )}`;
        const url = buildProxyUrl(searchUrl);

        try {
          const response = await fetch(url);
          const text = await response.text();
          const parser = new DOMParser();
          const doc = parser.parseFromString(text, 'text/html');
          const store = doc.querySelector('.js-store');
          if (!store) {
            throw new Error('Search results not found.');
          }
          const storeData = JSON.parse(store.getAttribute('data-content'));
          const pagination = storeData.store.page.data.pagination || { current: 1, total: 1 };
          const searchResults = storeData.store.page.data.results || [];

          const table = document.createElement('table');
          const thead = document.createElement('thead');
          const headerRow = document.createElement('tr');
          ['Artist', 'Song', 'Rating', 'Votes', 'Type'].forEach((title) => {
            const th = document.createElement('th');
            th.textContent = title;
            headerRow.appendChild(th);
          });
          thead.appendChild(headerRow);
          table.appendChild(thead);

          const tbody = document.createElement('tbody');
          let rows = 0;
          let previous = { song_name: '', artist_name: '' };

          Object.values(searchResults).forEach((value) => {
            if (EXCLUDED_TYPES.includes(value.type)) {
              return;
            }
            if (typeof value.tab_url !== 'string') {
              return;
            }
            if (!value.tab_url.includes('tabs.ultimate-guitar.com/tab/')) {
              return;
            }

            let songName = value.song_name || '';
            let artistName = value.artist_name || '';
            if (artistName === previous.artist_name) {
              artistName = '';
            }
            previous = value;

            const row = document.createElement('tr');
            if (value.type === 'Tabs') {
              row.style.backgroundColor = 'LightGrey';
            }

            const artistCell = document.createElement('td');
            artistCell.textContent = artistName;
            row.appendChild(artistCell);

            const songCell = document.createElement('td');
            const link = document.createElement('a');
            link.href = '#';
            link.textContent = songName;
            link.addEventListener('click', (event) => {
              event.preventDefault();
              navigate({ tab: value.tab_url, view: 'song' });
            });
            songCell.appendChild(link);
            row.appendChild(songCell);

            const ratingCell = document.createElement('td');
            ratingCell.textContent = '⭐'.repeat(Math.floor(value.rating || 0));
            row.appendChild(ratingCell);

            const votesCell = document.createElement('td');
            votesCell.textContent = value.votes || '';
            row.appendChild(votesCell);

            const typeCell = document.createElement('td');
            typeCell.textContent = value.type || '';
            row.appendChild(typeCell);

            tbody.appendChild(row);
            rows += 1;
          });

          table.appendChild(tbody);
          resultsEl.innerHTML = '';
          resultsEl.appendChild(table);
          resultsEl.appendChild(renderPagination(pagination, query));

          if (rows === 0) {
            resultsEl.textContent = 'No results found.';
          }
          setStatus('', false);
        } catch (error) {
          setStatus(error.message || 'Search failed.', true);
        }
      }

      async function loadSong(tabUrl) {
        if (!tabUrl) {
          clearSong();
          return;
        }

        setStatus('Loading song...', false);
        clearSong();

        const url = buildProxyUrl(tabUrl);

        try {
          const response = await fetch(url);
          const text = await response.text();
          const parser = new DOMParser();
          const doc = parser.parseFromString(text, 'text/html');
          const store = doc.querySelector('.js-store');
          if (!store) {
            throw new Error('Song data not found.');
          }
          const storeData = JSON.parse(store.getAttribute('data-content'));
          const chordArray = storeData.store.page.data.tab_view.applicature || {};
          chordNames.length = 0;
          Object.keys(chordArray).forEach((key) => {
            if (key) {
              chordNames.push(key);
            }
          });

          const [parsedSongName] = findInObject(storeData, 'song_name');
          const [parsedArtistName] = findInObject(storeData, 'artist_name');
          const [parsedChords] = findInObject(storeData, 'content');

          artistEl.textContent = parsedArtistName || '';
          songEl.textContent = parsedSongName || '';
          chordShapesEl.innerHTML = '';
          chordsGridEl.dataset.rawChords = parsedChords || '';

          setStatus('', false);
        } catch (error) {
          setStatus(error.message || 'Failed to load song.', true);
        }
      }

      function applySongLayout() {
        const raw = chordsGridEl.dataset.rawChords || '';
        const columns = currentCols;
        const fontSize = currentFont;
        const transposeSteps = currentTranspose;
        const formatted = formatChords(raw, transposeSteps);
        const parts = splitColumns(formatted, columns);

        columnsInput.value = String(columns);
        fontValueEl.textContent = String(fontSize);
        transposeValueEl.textContent = String(transposeSteps);

        chordsGridEl.style.gridTemplateColumns = `repeat(${columns}, auto)`;
        chordsCol1El.style.fontSize = `${fontSize}px`;
        chordsCol2El.style.fontSize = `${fontSize}px`;
        chordsCol3El.style.fontSize = `${fontSize}px`;

        chordsCol1El.innerHTML = parts[0];
        chordsCol2El.innerHTML = parts[1];
        chordsCol3El.innerHTML = parts[2];

        chordsCol2El.hidden = columns < 2;
        chordsCol3El.hidden = columns < 3;

        chordShapesEl.innerHTML = '';
        chordNames.forEach((name) => {
          const transposed = transposeChord(name, transposeSteps);
          const img = document.createElement('img');
          img.src = `https://chordgenerator.net/${encodeURIComponent(transposed)}.png?s=1`;
          img.alt = transposed;
          chordShapesEl.appendChild(img);
        });
      }

      function runFromUrl() {
        const params = getParams();
        const query = params.get('q') || '';
        const page = Math.max(1, parseInt(params.get('page') || '1', 10));
        const tabUrl = params.get('tab') || '';
        const view = params.get('view') || (tabUrl ? 'song' : 'search');
        searchInput.value = query;

        columnsInput.value = String(currentCols);
        fontValueEl.textContent = String(currentFont);
        transposeValueEl.textContent = String(currentTranspose);

        if (view === 'search') {
          resultsEl.hidden = false;
          songControlsEl.style.display = 'none';
          clearSong();
          loadSearch(query, page);
        } else {
          resultsEl.hidden = true;
          songControlsEl.style.display = 'flex';
          loadSong(tabUrl).then(() => {
            applySongLayout();
          });
        }

        applySongLayout();
      }

      searchForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const query = searchInput.value.trim();
        navigate({ q: query, page: '1', tab: null, view: 'search' });
      });

      songControlsEl.addEventListener('change', () => {
        currentCols = Math.max(1, Math.min(3, parseInt(columnsInput.value, 10) || 1));
        applySongLayout();
      });

      function adjustValue(element, delta, min, max) {
        const current = parseInt(element.textContent, 10) || 0;
        const next = Math.max(min, Math.min(max, current + delta));
        element.textContent = String(next);
        currentTranspose = Math.max(-12, Math.min(12, parseInt(transposeValueEl.textContent, 10) || 0));
        currentFont = Math.max(8, Math.min(28, parseInt(fontValueEl.textContent, 10) || 12));
        applySongLayout();
      }

      transposeDownBtn.addEventListener('click', () => adjustValue(transposeValueEl, -1, -12, 12));
      transposeUpBtn.addEventListener('click', () => adjustValue(transposeValueEl, 1, -12, 12));
      fontDownBtn.addEventListener('click', () => adjustValue(fontValueEl, -1, 8, 28));
      fontUpBtn.addEventListener('click', () => adjustValue(fontValueEl, 1, 8, 28));

      window.addEventListener('popstate', runFromUrl);
      runFromUrl();
    </script>
  </body>
</html>
